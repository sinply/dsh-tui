# pnpm 11 reads package settings here, not from the "pnpm" field in package.json.
# The @deepseek-ai/dsh-* peer ranges are ">=0.0.1" but the registry only hosts
# prereleases (rc/alpha), which semver ranges without a prerelease comparator do
# not match. Pin them to the exact alpha.3 versions the current dsh channel
# publishes, so a fresh install resolves and the build typechecks against the
# runtime version (dsh 0.1.2-alpha.3).

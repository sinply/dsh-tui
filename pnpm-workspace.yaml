# pnpm 11 reads package settings here, not from the "pnpm" field in package.json.
# The @deepseek-ai/dsh-* peer ranges are ">=0.0.1" but the registry only hosts
# prereleases (rc/alpha), which semver ranges without a prerelease comparator do
# not match. Pin them to the exact versions the global dsh deployment uses so a
# fresh install can resolve and the build typechecks against the runtime version.
overrides:
  '@deepseek-ai/dsh-agent': 0.1.1-rc.2
  '@deepseek-ai/dsh-agent-loop': 0.1.1-rc.2
  '@deepseek-ai/dsh-commands': 0.1.1-rc.2
  '@deepseek-ai/dsh-compaction': 0.1.1-rc.2
  '@deepseek-ai/dsh-invariants': 0.1.1-rc.2
  '@deepseek-ai/dsh-llm': 0.1.1-rc.2
  '@deepseek-ai/dsh-llm-retry': 0.1.1-rc.2
  '@deepseek-ai/dsh-goal': 0.1.1-rc.2
  '@deepseek-ai/dsh-session': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-persistence': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-projection': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-projection-cache': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-query': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-reference': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-title': 0.1.1-rc.2
  '@deepseek-ai/dsh-skill': 0.1.1-rc.2
  '@deepseek-ai/dsh-subprocess': 0.1.1-rc.2
  '@deepseek-ai/dsh-system-prompt': 0.1.1-rc.2
  '@deepseek-ai/dsh-token-meter': 0.1.1-rc.2
  '@deepseek-ai/dsh-tools': 0.1.1-rc.2
  '@deepseek-ai/dsh-user-questions': 0.1.1-rc.2